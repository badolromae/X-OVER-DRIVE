var qrcode = function() {

  //---------------------------------------------------------------------
  // qrcode
  //---------------------------------------------------------------------

  /**
   * qrcode
   * @param typeNumber 1 to 40
   * @param errorCorrectionLevel 'L','M','Q','H'
   */
  var qrcode = function(typeNumber, errorCorrectionLevel) {

    var PAD0 = 0xEC;
    var PAD1 = 0x11;

    var _typeNumber = typeNumber;
    var _errorCorrectionLevel = QRErrorCorrectionLevel[errorCorrectionLevel];
    var _modules = null;
    var _moduleCount = 0;
    var _dataCache = null;
    var _dataList = [];

    var _this = {};

    var makeImpl = function(test, maskPattern) {

      _moduleCount = _typeNumber * 4 + 17;
      _modules = function(moduleCount) {
        var modules = new Array(moduleCount);
        for (var row = 0; row < moduleCount; row += 1) {
          modules[row] = new Array(moduleCount);
          for (var col = 0; col < moduleCount; col += 1) {
            modules[row][col] = null;
          }
        }
        return modules;
      }(_moduleCount);

      setupPositionProbePattern(0, 0);
      setupPositionProbePattern(_moduleCount - 7, 0);
      setupPositionProbePattern(0, _moduleCount - 7);
      setupPositionAdjustPattern();
      setupTimingPattern();
      setupTypeInfo(test, maskPattern);

      if (_typeNumber >= 7) {
        setupTypeNumber(test);
      }

      if (_dataCache == null) {
        _dataCache = createData(_typeNumber, _errorCorrectionLevel, _dataList);
      }

      mapData(_dataCache, maskPattern);
    };

    var setupPositionProbePattern = function(row, col) {

      for (var r = -1; r <= 7; r += 1) {

        if (row + r <= -1 || _moduleCount <= row + r) continue;

        for (var c = -1; c <= 7; c += 1) {

          if (col + c <= -1 || _moduleCount <= col + c) continue;

          if ( (0 <= r && r <= 6 && (c == 0 || c == 6) )
              || (0 <= c && c <= 6 && (r == 0 || r == 6) )
              || (2 <= r && r <= 4 && 2 <= c && c <= 4) ) {
            _modules[row + r][col + c] = true;
          } else {
            _modules[row + r][col + c] = false;
          }
        }
      }
    };

    var getBestMaskPattern = function() {

      var minLostPoint = 0;
      var pattern = 0;

      for (var i = 0; i < 8; i += 1) {

        makeImpl(true, i);

        var lostPoint = QRUtil.getLostPoint(_this);

        if (i == 0 || minLostPoint > lostPoint) {
          minLostPoint = lostPoint;
          pattern = i;
        }
      }

      return pattern;
    };

    var setupTimingPattern = function() {

      for (var r = 8; r < _moduleCount - 8; r += 1) {
        if (_modules[r][6] != null) {
          continue;
        }
        _modules[r][6] = (r % 2 == 0);
      }

      for (var c = 8; c < _moduleCount - 8; c += 1) {
        if (_modules[6][c] != null) {
          continue;
        }
        _modules[6][c] = (c % 2 == 0);
      }
    };

    var setupPositionAdjustPattern = function() {

      var pos = QRUtil.getPatternPosition(_typeNumber);

      for (var i = 0; i < pos.length; i += 1) {

        for (var j = 0; j < pos.length; j += 1) {

          var row = pos[i];
          var col = pos[j];

          if (_modules[row][col] != null) {
            continue;
          }

          for (var r = -2; r <= 2; r += 1) {

            for (var c = -2; c <= 2; c += 1) {

              if (r == -2 || r == 2 || c == -2 || c == 2
                  || (r == 0 && c == 0) ) {
                _modules[row + r][col + c] = true;
              } else {
                _modules[row + r][col + c] = false;
              }
            }
          }
        }
      }
    };

    var setupTypeNumber = function(test) {

      var bits = QRUtil.getBCHTypeNumber(_typeNumber);

      for (var i = 0; i < 18; i += 1) {
        var mod = (!test && ( (bits >> i) & 1) == 1);
        _modules[Math.floor(i / 3)][i % 3 + _moduleCount - 8 - 3] = mod;
      }

      for (var i = 0; i < 18; i += 1) {
        var mod = (!test && ( (bits >> i) & 1) == 1);
        _modules[i % 3 + _moduleCount - 8 - 3][Math.floor(i / 3)] = mod;
      }
    };

    var setupTypeInfo = function(test, maskPattern) {

      var data = (_errorCorrectionLevel << 3) | maskPattern;
      var bits = QRUtil.getBCHTypeInfo(data);

      // vertical
      for (var i = 0; i < 15; i += 1) {

        var mod = (!test && ( (bits >> i) & 1) == 1);

        if (i < 6) {
          _modules[i][8] = mod;
        } else if (i < 8) {
          _modules[i + 1][8] = mod;
        } else {
          _modules[_moduleCount - 15 + i][8] = mod;
        }
      }

      // horizontal
      for (var i = 0; i < 15; i += 1) {

        var mod = (!test && ( (bits >> i) & 1) == 1);

        if (i < 8) {
          _modules[8][_moduleCount - i - 1] = mod;
        } else if (i < 9) {
          _modules[8][15 - i - 1 + 1] = mod;
        } else {
          _modules[8][15 - i - 1] = mod;
        }
      }

      // fixed module
      _modules[_moduleCount - 8][8] = (!test);
    };

    var mapData = function(data, maskPattern) {

      var inc = -1;
      var row = _moduleCount - 1;
      var bitIndex = 7;
      var byteIndex = 0;
      var maskFunc = QRUtil.getMaskFunction(maskPattern);

      for (var col = _moduleCount - 1; col > 0; col -= 2) {

        if (col == 6) col -= 1;

        while (true) {

          for (var c = 0; c < 2; c += 1) {

            if (_modules[row][col - c] == null) {

              var dark = false;

              if (byteIndex < data.length) {
                dark = ( ( (data[byteIndex] >>> bitIndex) & 1) == 1);
              }

              var mask = maskFunc(row, col - c);

              if (mask) {
                dark = !dark;
              }

              _modules[row][col - c] = dark;
              bitIndex -= 1;

              if (bitIndex == -1) {
                byteIndex += 1;
                bitIndex = 7;
              }
            }
          }

          row += inc;

          if (row < 0 || _moduleCount <= row) {
            row -= inc;
            inc = -inc;
            break;
          }
        }
      }
    };

    var createBytes = function(buffer, rsBlocks) {

      var offset = 0;

      var maxDcCount = 0;
      var maxEcCount = 0;

      var dcdata = new Array(rsBlocks.length);
      var ecdata = new Array(rsBlocks.length);

      for (var r = 0; r < rsBlocks.length; r += 1) {

        var dcCount = rsBlocks[r].dataCount;
        var ecCount = rsBlocks[r].totalCount - dcCount;

        maxDcCount = Math.max(maxDcCount, dcCount);
        maxEcCount = Math.max(maxEcCount, ecCount);

        dcdata[r] = new Array(dcCount);

        for (var i = 0; i < dcdata[r].length; i += 1) {
          dcdata[r][i] = 0xff & buffer.getBuffer()[i + offset];
        }
        offset += dcCount;

        var rsPoly = QRUtil.getErrorCorrectPolynomial(ecCount);
        var rawPoly = qrPolynomial(dcdata[r], rsPoly.getLength() - 1);

        var modPoly = rawPoly.mod(rsPoly);
        ecdata[r] = new Array(rsPoly.getLength() - 1);
        for (var i = 0; i < ecdata[r].length; i += 1) {
          var modIndex = i + modPoly.getLength() - ecdata[r].length;
          ecdata[r][i] = (modIndex >= 0)? modPoly.getAt(modIndex) : 0;
        }
      }

      var totalCodeCount = 0;
      for (var i = 0; i < rsBlocks.length; i += 1) {
        totalCodeCount += rsBlocks[i].totalCount;
      }

      var data = new Array(totalCodeCount);
      var index = 0;

      for (var i = 0; i < maxDcCount; i += 1) {
        for (var r = 0; r < rsBlocks.length; r += 1) {
          if (i < dcdata[r].length) {
            data[index] = dcdata[r][i];
            index += 1;
          }
        }
      }

      for (var i = 0; i < maxEcCount; i += 1) {
        for (var r = 0; r < rsBlocks.length; r += 1) {
          if (i < ecdata[r].length) {
            data[index] = ecdata[r][i];
            index += 1;
          }
        }
      }

      return data;
    };

    var createData = function(typeNumber, errorCorrectionLevel, dataList) {

      var rsBlocks = QRRSBlock.getRSBlocks(typeNumber, errorCorrectionLevel);

      var buffer = qrBitBuffer();

      for (var i = 0; i < dataList.length; i += 1) {
        var data = dataList[i];
        buffer.put(data.getMode(), 4);
        buffer.put(data.getLength(), QRUtil.getLengthInBits(data.getMode(), typeNumber) );
        data.write(buffer);
      }

      // calc num max data.
      var totalDataCount = 0;
      for (var i = 0; i < rsBlocks.length; i += 1) {
        totalDataCount += rsBlocks[i].dataCount;
      }

      if (buffer.getLengthInBits() > totalDataCount * 8) {
        throw 'code length overflow. ('
          + buffer.getLengthInBits()
          + '>'
          + totalDataCount * 8
          + ')';
      }

      // end code
      if (buffer.getLengthInBits() + 4 <= totalDataCount * 8) {
        buffer.put(0, 4);
      }

      // padding
      while (buffer.getLengthInBits() % 8 != 0) {
        buffer.putBit(false);
      }

      // padding
      while (true) {

        if (buffer.getLengthInBits() >= totalDataCount * 8) {
          break;
        }
        buffer.put(PAD0, 8);

        if (buffer.getLengthInBits() >= totalDataCount * 8) {
          break;
        }
        buffer.put(PAD1, 8);
      }

      return createBytes(buffer, rsBlocks);
    };

    _this.addData = function(data, mode) {

      mode = mode || 'Byte';

      var newData = null;

      switch(mode) {
      case 'Numeric' :
        newData = qrNumber(data);
        break;
      case 'Alphanumeric' :
        newData = qrAlphaNum(data);
        break;
      case 'Byte' :
        newData = qr8BitByte(data);
        break;
      case 'Kanji' :
        newData = qrKanji(data);
        break;
      default :
        throw 'mode:' + mode;
      }

      _dataList.push(newData);
      _dataCache = null;
    };

    _this.isDark = function(row, col) {
      if (row < 0 || _moduleCount <= row || col < 0 || _moduleCount <= col) {
        throw row + ',' + col;
      }
      return _modules[row][col];
    };

    _this.getModuleCount = function() {
      return _moduleCount;
    };

    _this.make = function() {
      if (_typeNumber < 1) {
        var typeNumber = 1;

        for (; typeNumber < 40; typeNumber++) {
          var rsBlocks = QRRSBlock.getRSBlocks(typeNumber, _errorCorrectionLevel);
          var buffer = qrBitBuffer();

          for (var i = 0; i < _dataList.length; i++) {
            var data = _dataList[i];
            buffer.put(data.getMode(), 4);
            buffer.put(data.getLength(), QRUtil.getLengthInBits(data.getMode(), typeNumber) );
            data.write(buffer);
          }

          var totalDataCount = 0;
          for (var i = 0; i < rsBlocks.length; i++) {
            totalDataCount += rsBlocks[i].dataCount;
          }

          if (buffer.getLengthInBits() <= totalDataCount * 8) {
            break;
          }
        }

        _typeNumber = typeNumber;
      }

      makeImpl(false, getBestMaskPattern() );
    };

    _this.createTableTag = function(cellSize, margin) {

      cellSize = cellSize || 2;
      margin = (typeof margin == 'undefined')? cellSize * 4 : margin;

      var qrHtml = '';

      qrHtml += '<table style="';
      qrHtml += ' border-width: 0px; border-style: none;';
      qrHtml += ' border-collapse: collapse;';
      qrHtml += ' padding: 0px; margin: ' + margin + 'px;';
      qrHtml += '">';
      qrHtml += '<tbody>';

      for (var r = 0; r < _this.getModuleCount(); r += 1) {

        qrHtml += '<tr>';

        for (var c = 0; c < _this.getModuleCount(); c += 1) {
          qrHtml += '<td style="';
          qrHtml += ' border-width: 0px; border-style: none;';
          qrHtml += ' border-collapse: collapse;';
          qrHtml += ' padding: 0px; margin: 0px;';
          qrHtml += ' width: ' + cellSize + 'px;';
          qrHtml += ' height: ' + cellSize + 'px;';
          qrHtml += ' background-color: ';
          qrHtml += _this.isDark(r, c)? '#000000' : '#ffffff';
          qrHtml += ';';
          qrHtml += '"/>';
        }

        qrHtml += '</tr>';
      }

      qrHtml += '</tbody>';
      qrHtml += '</table>';

      return qrHtml;
    };

    _this.createSvgTag = function(cellSize, margin, alt, title) {

      var opts = {};
      if (typeof arguments[0] == 'object') {
        // Called by options.
        opts = arguments[0];
        // overwrite cellSize and margin.
        cellSize = opts.cellSize;
        margin = opts.margin;
        alt = opts.alt;
        title = opts.title;
      }

      cellSize = cellSize || 2;
      margin = (typeof margin == 'undefined')? cellSize * 4 : margin;

      // Compose alt property surrogate
      alt = (typeof alt === 'string') ? {text: alt} : alt || {};
      alt.text = alt.text || null;
      alt.id = (alt.text) ? alt.id || 'qrcode-description' : null;

      // Compose title property surrogate
      title = (typeof title === 'string') ? {text: title} : title || {};
      title.text = title.text || null;
      title.id = (title.text) ? title.id || 'qrcode-title' : null;

      var size = _this.getModuleCount() * cellSize + margin * 2;
      var c, mc, r, mr, qrSvg='', rect;

      rect = 'l' + cellSize + ',0 0,' + cellSize +
        ' -' + cellSize + ',0 0,-' + cellSize + 'z ';

      qrSvg += '<svg version="1.1" xmlns="http://www.w3.org/2000/svg"';
      qrSvg += !opts.scalable ? ' width="' + size + 'px" height="' + size + 'px"' : '';
      qrSvg += ' viewBox="0 0 ' + size + ' ' + size + '" ';
      qrSvg += ' preserveAspectRatio="xMinYMin meet"';
      qrSvg += (title.text || alt.text) ? ' role="img" aria-labelledby="' +
          escapeXml([title.id, alt.id].join(' ').trim() ) + '"' : '';
      qrSvg += '>';
      qrSvg += (title.text) ? '<title id="' + escapeXml(title.id) + '">' +
          escapeXml(title.text) + '</title>' : '';
      qrSvg += (alt.text) ? '<description id="' + escapeXml(alt.id) + '">' +
          escapeXml(alt.text) + '</description>' : '';
      qrSvg += '<rect width="100%" height="100%" fill="white" cx="0" cy="0"/>';
      qrSvg += '<path d="';

      for (r = 0; r < _this.getModuleCount(); r += 1) {
        mr = r * cellSize + margin;
        for (c = 0; c < _this.getModuleCount(); c += 1) {
          if (_this.isDark(r, c) ) {
            mc = c*cellSize+margin;
            qrSvg += 'M' + mc + ',' + mr + rect;
          }
        }
      }

      qrSvg += '" stroke="transparent" fill="black"/>';
      qrSvg += '</svg>';

      return qrSvg;
    };

    _this.createDataURL = function(cellSize, margin) {

      cellSize = cellSize || 2;
      margin = (typeof margin == 'undefined')? cellSize * 4 : margin;

      var size = _this.getModuleCount() * cellSize + margin * 2;
      var min = margin;
      var max = size - margin;

      return createDataURL(size, size, function(x, y) {
        if (min <= x && x < max && min <= y && y < max) {
          var c = Math.floor( (x - min) / cellSize);
          var r = Math.floor( (y - min) / cellSize);
          return _this.isDark(r, c)? 0 : 1;
        } else {
          return 1;
        }

let AC=null;
function ac(){ try{ if(!AC) AC=new (window.AudioContext||window.webkitAudioContext)(); if(AC.state==='suspended') AC.resume(); }catch(e){} return AC; }
function snd(k){ if(TSPD>1||APP.mute) return; const c=ac(); if(!c) return; const t=c.currentTime;
  const tone=(f,d,type,v,f2)=>{ const o=c.createOscillator(), g=c.createGain(); o.type=type; o.frequency.setValueAtTime(f,t); if(f2) o.frequency.exponentialRampToValueAtTime(f2,t+d); g.gain.setValueAtTime(v,t); g.gain.exponentialRampToValueAtTime(0.0008,t+d); o.connect(g); g.connect(c.destination); o.start(t); o.stop(t+d+0.02); };
  const noise=(d,v,fq)=>{ const len=Math.floor(c.sampleRate*d), b=c.createBuffer(1,len,c.sampleRate), a=b.getChannelData(0); for(let i=0;i<len;i++) a[i]=(Math.random()*2-1)*(1-i/len); const s=c.createBufferSource(); s.buffer=b; const f=c.createBiquadFilter(); f.type='lowpass'; f.frequency.value=fq; const g=c.createGain(); g.gain.value=v; s.connect(f); f.connect(g); g.connect(c.destination); s.start(t); };
  if(k==='swing') noise(0.12,0.12,2500);
  else if(k==='hit') { noise(0.18,0.5,900); tone(140,0.18,'square',0.15,60); }
  else if(k==='hit2'){ noise(0.3,0.7,600); tone(110,0.3,'sawtooth',0.2,40); }
  else if(k==='block'){ tone(900,0.06,'square',0.1,500); noise(0.06,0.2,3000); }
  else if(k==='ko'){ noise(0.8,0.6,400); tone(90,0.9,'sawtooth',0.25,30); }
  else if(k==='fb'){ tone(300,0.4,'sine',0.2,900); noise(0.3,0.15,1800); }
  else if(k==='ui'){ tone(700,0.06,'sine',0.08); }
  else if(k==='bell'){ tone(1200,0.5,'triangle',0.15); tone(1800,0.4,'sine',0.08); } }

// ---------- 기술 데이터 ----------
const ATK={

  hp:{pose:'hp',st:8,ac:4,rc:17,dmg:95,hs:22,bs:14,push:13,lv:'high',y0:150,y1:330,lift:14},

  hk:{pose:'hk',st:11,ac:4,rc:20,dmg:110,hs:24,bs:15,push:15,lv:'mid',y0:130,y1:300,kd:1},
  chp:{pose:'hp',st:6,ac:5,rc:18,dmg:85,hs:20,bs:12,push:10,lv:'high',y0:110,y1:380,lift:22},
  clk:{pose:'down',st:6,ac:4,rc:13,dmg:50,hs:15,bs:10,push:8,lv:'low',y0:0,y1:95,low:1},
  chk:{pose:'down',st:9,ac:5,rc:22,dmg:90,hs:20,bs:14,push:10,lv:'low',y0:0,y1:95,kd:1,low:1},
  jp:{pose:'lp',st:4,ac:9,rc:0,dmg:60,hs:16,bs:10,push:6,lv:'over',y0:150,y1:280,air:1},
  jk:{pose:'jkick',st:5,ac:11,rc:0,dmg:80,hs:18,bs:12,push:8,lv:'over',y0:40,y1:190,air:1},
  fb:{pose:'fireball',st:12,ac:1,rc:26,dmg:0,proj:1},

const ROWK={m:1.25,f:1.18}, ROW1={m:['intro','idle','lp','lk','taunt','block','hk_side','hp'],f:['intro','lp','taunt','block','idle','hp']};
function pk(ch,pose){ return ROW1[ch].includes(pose)?1:ROWK[ch]; }
function meta(ch,pose){ return SPR[ch].meta[pose]||SPR[ch].meta.idle; }
function reach(ch,pose){ const m=meta(ch,pose); return (m[2]-m[4])*SC*pk(ch,pose); }

// ---------- 파이터 ----------
function newF(ch,side,alt){ return {ch,alt,x:side?W-330:330,y:0,vx:0,vy:0,face:side?-1:1,hp:1000,st:'idle',t:0,atk:null,hit:false,hs:0,stop:0,cd:0,inp:0,prev:0,combo:0,shake:0}; }
function down(f){ return f.st==='down'||f.st==='getup'||f.st==='ko'; }
function hurtbox(f){ if(down(f)||f.st==='win') return null; const cr=(f.st==='crouch'||(f.st==='blk'&&f.crouch)||(f.st==='atk'&&f.atk&&f.atk.low)); const h=cr?195:(f.y>0?270:300); return {x0:f.x-38,x1:f.x+38,y0:f.y,y1:f.y+h}; }
function startAtk(f,k){ f.st='atk'; f.atk=ATK[k]; f.ak=k; f.t=0; f.hit=false; snd('swing'); if(!f.atk.air) f.vx=0; }
function inputsOf(f){ const I=f.inp, E=f.inp&~f.prev; const fw=f.face>0?B.r:B.l, bk=f.face>0?B.l:B.r; return {I,E,fw:!!(I&fw),bk:!!(I&bk),u:!!(I&B.u),d:!!(I&B.d)}; }
function stepF(f,o,G){
  if(f.stop>0){ f.stop--; return; }

  const {I,E,fw,bk,u,d}=inputsOf(f);
  const grounded=f.y<=0;
  const neutral=['idle','walk','back','crouch'].includes(f.st);
  if(neutral&&grounded){ f.face=o.x>=f.x?1:-1; }
  const atkPress=E&(B.a|B.s|B.z|B.x);
  switch(f.st){
    case 'idle': case 'walk': case 'back': case 'crouch': {
      if(G.phase!=='fight'){ f.st=G.phase==='intro'?'idle':f.st; f.vx=0; break; }
      if(atkPress){ const both=(I&B.s)&&(I&B.x);
        if(both&&f.cd===0){ startAtk(f,'fb'); break; }
        if(d){ startAtk(f,(E&(B.a|B.s))?'chp':((E&B.x)?'chk':'clk')); break; }
        startAtk(f,(E&B.a)?'lp':(E&B.s)?'hp':(E&B.z)?'lk':'hk'); break; }
      if(u){ f.st='jump'; f.t=0; f.vy=21.5; f.vx=(I&B.r?1:I&B.l?-1:0)*6.6; f.jatk=false; break; }
      if(d){ f.st='crouch'; f.vx=0; break; }
      if(fw){ f.st='walk'; f.vx=4.6*f.face; } else if(bk){ f.st='back'; f.vx=-3.7*f.face; } else { f.st='idle'; f.vx=0; }
      break; }
    case 'jump': {
      if(atkPress&&!f.jatk&&G.phase==='fight'){ f.jatk=true; f.st='atk'; f.ak=(E&(B.a|B.s))?'jp':'jk'; f.atk=ATK[f.ak]; f.t=0; f.hit=false; snd('swing'); }
      break; }
    case 'atk': {
      const A=f.atk; const end=A.st+A.ac+A.rc;
      if(A.proj&&f.t===A.st){ G.proj.push({x:f.x+f.face*80,y:f.y+190,vx:10*f.face,own:f,life:150}); f.cd=100; snd('fb'); }
      if(!A.air&&f.t>=end){ f.st=d?'crouch':'idle'; f.atk=null; }
      break; }
    case 'hit': if(f.t>=f.hs&&grounded){ f.st='idle'; f.combo=0; } break;
    case 'blk': if(f.t>=f.hs){ f.st=f.crouch?'crouch':'idle'; } break;
    case 'down': if(f.t>=48&&f.hp>0){ f.st='getup'; f.t=0; } break;
    case 'getup': if(f.t>=16){ f.st='idle'; f.t=0; } break;
  }
  // 물리
  const air=f.y>0||f.vy>0;
  if(air||f.st==='jump'||(f.st==='atk'&&f.atk&&f.atk.air)){
    f.vy-=1.15; f.y+=f.vy; f.x+=f.vx;
    if(f.y<=0){ f.y=0; f.vy=0;
      if(f.st==='jump'||(f.st==='atk'&&f.atk&&f.atk.air)){ f.st='idle'; f.atk=null; f.vx=0; f.t=0; }
      else if(f.st==='hit'&&f.kd){ f.st=f.hp<=0?'ko':'down'; f.t=0; f.vx=0; G.shake=8; snd('hit2'); }
      else if(f.st==='hit'){ f.vx*=0.3; } } }
  else { f.x+=f.vx; if(f.st==='hit'||f.st==='blk'||f.st==='down'||f.st==='ko') f.vx*=0.85; }
  if(f.st==='atk'&&f.atk&&f.atk.lift&&!f.atk.air){ const A=f.atk; f.lift=f.t<A.st+A.ac?Math.min(A.lift,f.t*3):Math.max(0,A.lift-(f.t-A.st-A.ac)*2); } else f.lift=0;
}
function canBlock(f,A,atkr){ if(!['idle','walk','back','crouch','blk'].includes(f.st)||f.y>0) return false; const {bk,d}=inputsOf(f); const toward=atkr.x>f.x?1:-1; const holdBack=(f.inp&(toward>0?B.l:B.r));
  if(!holdBack) return false; if(A.lv==='low') return !!d; if(A.lv==='over') return !d; return true; }
function hitCheck(f,o,G){
  if(f.st!=='atk'||!f.atk||f.hit||f.stop>0) return; const A=f.atk; if(A.proj||f.t<A.st||f.t>=A.st+A.ac) return;
  const hb=hurtbox(o); if(!hb) return; const r=reach(f.ch,A.pose); const bx0=f.x+f.face*(r-90), bx1=f.x+f.face*r;
  const x0=Math.min(bx0,bx1), x1=Math.max(bx0,bx1), y0=f.y+A.y0, y1=f.y+A.y1;
  if(x1<hb.x0||x0>hb.x1||y1<hb.y0||y0>hb.y1) return;
  f.hit=true; applyHit(f,o,A,G,(Math.max(x0,hb.x0)+Math.min(x1,hb.x1))/2,(Math.max(y0,hb.y0)+Math.min(y1,hb.y1))/2);
}
function applyHit(f,o,A,G,cx,cy,proj){
  if(canBlock(o,A,f)){ o.st='blk'; o.t=0; o.hs=A.bs; o.crouch=!!(o.inp&B.d); o.vx=-o.face*(A.push*0.7); f.stop=o.stop=5; spark(G,cx,cy,'#9fd3ff',8); snd('block'); return; }
  const wasHit=o.st==='hit'; o.combo=wasHit?o.combo+1:1; const scale=Math.max(0.4,1-0.12*(o.combo-1));
  const dmg=Math.round(A.dmg*scale); o.hp=Math.max(0,o.hp-dmg); G.dmgTxt.push({x:cx,y:cy,v:dmg,t:0});
  o.st='hit'; o.t=0; o.hs=A.hs; o.atk=null; const dir=f.x<o.x?1:-1; o.face=-dir;
  const heavy=A.dmg>=80; f.stop=o.stop=heavy?9:6; spark(G,cx,cy,heavy?'#ffd23f':'#fff3a0',heavy?18:10); snd(heavy?'hit2':'hit'); if(heavy) G.shake=heavy?10:4;
  if(A.kd||o.hp<=0||o.y>0){ o.kd=1; o.vy=o.hp<=0?13:(o.y>0?8:10); o.vx=dir*(o.hp<=0?7:4.5); o.y=Math.max(o.y,1); }
  else { o.kd=0; o.vx=dir*A.push; }
  if(o.combo>=2) G.comboTxt={n:o.combo,side:G.F.indexOf(f),t:0};
  if(o.hp<=0&&G.phase==='fight'){ G.phase='ko'; G.pt=0; G.slow=40; snd('ko'); }
}
function spark(G,x,y,col,n){ for(let i=0;i<n;i++){ const a=Math.random()*Math.PI*2, s=3+Math.random()*7; G.fx.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,t:0,col,life:14+Math.random()*10}); } G.fx.push({x,y,ring:1,t:0,life:12,col}); }
function stepProj(G){ for(const p of G.proj){ if(p.dead) continue; p.x+=p.vx; p.life--; const o=G.F[0]===p.own?G.F[1]:G.F[0];
    const hb=hurtbox(o); if(hb&&p.x+28>hb.x0&&p.x-28<hb.x1&&p.y>hb.y0&&p.y<hb.y1){ p.dead=1; applyHit(p.own,o,{dmg:80,hs:20,bs:12,push:10,lv:'mid',kd:0},G,p.x,p.y); }
    if(p.life<=0||p.x<-50||p.x>W+50) p.dead=1; }
  for(let i=0;i<G.proj.length;i++) for(let j=i+1;j<G.proj.length;j++){ const a=G.proj[i], b=G.proj[j]; if(!a.dead&&!b.dead&&a.own!==b.own&&Math.abs(a.x-b.x)<40){ a.dead=b.dead=1; spark(G,(a.x+b.x)/2,a.y,'#9fd3ff',14); } }
  G.proj=G.proj.filter(p=>!p.dead); }
function separate(G){ const [a,b]=G.F; if(a.y<60&&b.y<60&&!down(a)&&!down(b)){ const dx=b.x-a.x, md=72; if(Math.abs(dx)<md){ const push=(md-Math.abs(dx))/2*(dx>=0?1:-1); a.x-=push; b.x+=push; } }
  for(const f of G.F) f.x=Math.max(60,Math.min(W-60,f.x)); }

// ---------- CPU ----------
function cpuInput(f,o,G){ const ai=f.ai||(f.ai={wait:0,hold:0,want:0}); if(G.phase!=='fight') return 0;
  const dist=Math.abs(o.x-f.x), fw=o.x>f.x?B.r:B.l, bk=o.x>f.x?B.l:B.r; let b=0;
  if(ai.hold>0){ ai.hold--; return ai.want; }
  const oAtk=o.st==='atk'&&o.atk&&!o.atk.proj&&o.t<o.atk.st+2;
  const proj=G.proj.find(p=>p.own===o&&Math.abs(p.x-f.x)<260);
  if((oAtk&&dist<260&&Math.random()<0.55)||(proj&&Math.random()<0.5)){ b=bk|((o.atk&&o.atk.low)?B.d:0); ai.want=b; ai.hold=10; return b; }
  if(o.y>40&&dist<240&&o.vy<6&&Math.random()<0.35){ ai.want=B.d|B.s; ai.hold=2; return B.d|B.s; }
  if(f.st==='hit'||f.st==='blk') return 0;
  if(dist>300){ if(f.cd===0&&Math.random()<0.012){ ai.want=B.s|B.x; ai.hold=2; return B.s|B.x; } if(Math.random()<0.006){ ai.want=B.u|fw; ai.hold=3; return B.u|fw; } return fw; }
  if(dist>170){ const r=Math.random(); if(r<0.02){ ai.want=B.u|fw; ai.hold=3; return B.u|fw; } if(r<0.04){ ai.want=B.x; ai.hold=1; return B.x; } if(r<0.06){ ai.want=B.d|B.x; ai.hold=2; return B.d|B.x; } return Math.random()<0.75?fw:0; }
  if(Math.random()<0.09){ const pick=[B.a,B.a,B.z,B.z,B.s,B.x,B.d|B.z,B.d|B.x][Math.floor(Math.random()*8)]; ai.want=pick; ai.hold=1; return pick; }
  if(Math.random()<0.04){ ai.want=bk; ai.hold=12; return bk; }
  return 0; }

// ---------- 경기 ----------
let G=null;
function newMatch(o){ // o:{p:[{name,ch,ctl}],best,onEnd}
  const alt=o.p[0].ch===o.p[1].ch;
  G={on:true,pause:false,p:o.p,best:o.best||2,wins:[0,0],round:1,onEnd:o.onEnd,F:[],proj:[],fx:[],dmgTxt:[],comboTxt:null,shake:0,slow:0,frame:0,acc:0,last:performance.now()};
  G.F=[newF(o.p[0].ch,0,false),newF(o.p[1].ch,1,alt)]; startRound(); }
function startRound(){ const keep=G.F.map(f=>[f.ch,f.alt]); G.F=[newF(keep[0][0],0,keep[0][1]),newF(keep[1][0],1,keep[1][1])]; G.proj=[]; G.fx=[]; G.dmgTxt=[]; G.timer=60*60; G.phase='intro'; G.pt=0; G.F.forEach(f=>{ f.st='idle'; }); snd('bell'); netPush(); }
function readInput(i){ const c=G.p[i].ctl; const f=G.F[i], o=G.F[1-i];
  if(c==='kb') return KB.held|(PADL.bits); if(c==='pad') return PADL.bits|KB.held; if(c==='cpu') return cpuInput(f,o,G);
  if(c&&c.startsWith('net:')){ const pl=NETP.get(c.slice(4)); return pl?pl.inp:0; } return 0; }
function tick(){ if(!G||!G.on) return; G.frame++;
  if(G.slow>0&&G.frame%3!==0){ G.slow--; return; }
  for(let i=0;i<2;i++){ const f=G.F[i]; f.prev=f.inp; f.inp=readInput(i); }
  for(let i=0;i<2;i++) stepF(G.F[i],G.F[1-i],G);
  for(let i=0;i<2;i++) hitCheck(G.F[i],G.F[1-i],G);
  stepProj(G); separate(G);
  for(const p of G.fx){ p.t++; if(!p.ring){ p.x+=p.vx; p.y+=p.vy; p.vx*=0.9; p.vy*=0.9; } } G.fx=G.fx.filter(p=>p.t<p.life);
  for(const d of G.dmgTxt) d.t++; G.dmgTxt=G.dmgTxt.filter(d=>d.t<45); if(G.comboTxt){ G.comboTxt.t++; if(G.comboTxt.t>70) G.comboTxt=null; }
  if(G.shake>0) G.shake--;
  G.pt++;
  if(G.phase==='intro'&&G.pt>=110){ G.phase='fight'; G.pt=0; }
  else if(G.phase==='fight'){ if(G.timer>0) G.timer--; if(G.timer<=0){ G.phase='time'; G.pt=0; snd('bell'); } }
  else if((G.phase==='ko'||G.phase==='time')&&G.pt>=150){ endRound(); }
  else if(G.phase==='rend'&&G.pt>=150){ if(G.wins[0]>=G.best||G.wins[1]>=G.best) endMatch(); else { G.round++; startRound(); } }
}
function endRound(){ const [a,b]=G.F; let w=-1; if(a.hp>b.hp) w=0; else if(b.hp>a.hp) w=1; if(w<0){ G.draws=(G.draws||0)+1; if(G.draws>=2){ w=Math.random()<0.5?0:1; G.judge=1; } } G.rw=w;
  if(w>=0){ G.wins[w]++; G.F[w].st='win'; G.F[w].t=0; G.F[w].vx=0; } G.phase='rend'; G.pt=0; netPush(); }
function endMatch(){ const w=G.wins[0]>G.wins[1]?0:1; G.on=false; const cb=G.onEnd; const res={w,p:G.p,wins:G.wins.slice()}; netPush(); if(cb) cb(res); }
function pauseToggle(){ if(!G) return; G.pause=!G.pause; }

// ---------- 그리기 ----------
const cv=document.getElementById('cv'), cx=cv.getContext('2d');
function drawF(f,i){ const pose=poseOf(f); const m=meta(f.ch,pose); const im=IMG[f.ch+(f.alt?'2':'')]; if(!im) return;
  const [sx,sy,w,h,ax,ay]=m; const x=f.x, y=GY-f.y-(f.lift||0);
  cx.save(); cx.globalAlpha=0.18; cx.fillStyle='#000'; cx.beginPath(); cx.ellipse(x,GY+4,62*Math.max(0.4,1-f.y/400),12,0,0,7); cx.fill(); cx.restore();
  cx.save(); cx.translate(x,y); if(f.face<0) cx.scale(-1,1);
  let sc=SC*pk(f.ch,pose); if(f.st==='idle'||f.st==='crouch') sc*=1+Math.sin((G.frame+i*30)/9)*0.008;
  if(f.st==='getup'&&f.t%6<3) cx.globalAlpha=0.5;
  if(f.stop>0&&f.st==='hit') cx.translate((Math.random()-0.5)*6,0);
  cx.drawImage(im,sx,sy,w,h,-ax*sc,-ay*sc,w*sc,h*sc);
  if(f.st==='hit'&&f.t<4){ cx.globalCompositeOperation='source-atop'; cx.globalAlpha=0.35; cx.fillStyle='#fff'; cx.fillRect(-ax*sc,-ay*sc,w*sc,h*sc); }
  cx.restore(); }
function poseOf(f){ switch(f.st){
  case 'idle': return 'idle'; case 'walk': return (Math.floor(f.t/10)%2)?'walk':'dash'; case 'back': return (Math.floor(f.t/12)%2)?'walk':'idle';
  case 'crouch': return 'crouch'; case 'jump': return 'jump'; case 'atk': return f.atk.pose;

function drawHUD(){ const p=G.p;
  for(let i=0;i<2;i++){ const f=G.F[i], L=i===0; const bw=470, bx=L?40:W-40-bw, by=28;
    cx.fillStyle='#2b2b2b'; cx.fillRect(bx-4,by-4,bw+8,34);
    const r=f.hp/1000; cx.fillStyle='#d23'; cx.fillRect(bx,by,bw,26);
    const g=cx.createLinearGradient(0,by,0,by+26); g.addColorStop(0,'#ffe066'); g.addColorStop(1,'#f5a623'); cx.fillStyle=g;
    if(L) cx.fillRect(bx+bw*(1-r),by,bw*r,26); else cx.fillRect(bx,by,bw*r,26);
    cx.font='700 22px system-ui,sans-serif'; cx.fillStyle='#222'; cx.textAlign=L?'left':'right'; cx.fillText(`${p[i].name} · ${CH[f.ch].name}`,L?bx:bx+bw,by+56);

  cx.textAlign='center'; cx.fillStyle='#222'; cx.font='900 46px system-ui,sans-serif'; cx.fillText(String(Math.ceil(G.timer/60)).padStart(2,'0'),W/2,64);
  if(G.comboTxt){ const c=G.comboTxt; cx.save(); cx.font='900 44px system-ui,sans-serif'; cx.textAlign=c.side===0?'left':'right'; cx.fillStyle='#ff5b2e'; cx.strokeStyle='#fff'; cx.lineWidth=6; const tx=c.side===0?50:W-50; cx.strokeText(`${c.n} HIT!`,tx,170); cx.fillText(`${c.n} HIT!`,tx,170); cx.restore(); }
  let msg='', sub='';

  else if(G.phase==='ko') msg='K.O.!'; else if(G.phase==='time') msg='TIME UP';
  else if(G.phase==='rend'){ msg=G.rw<0?'DRAW':`${G.p[G.rw].name} WIN`; if(G.judge&&G.rw>=0) sub='판정승!'; if(G.rw>=0&&G.F[G.rw].hp>=1000) sub='PERFECT!'; }
  if(msg){ cx.save(); const sc=G.phase==='intro'&&G.pt%60<10?1.4-(G.pt%60)/25:1; cx.translate(W/2,H*0.42); cx.scale(sc,sc); cx.font='900 96px system-ui,sans-serif'; cx.lineWidth=12; cx.strokeStyle='#111'; cx.strokeText(msg,0,0); cx.fillStyle=msg==='K.O.!'?'#ff3b3b':'#ffd23f'; cx.fillText(msg,0,0);
    if(sub){ cx.font='900 46px system-ui,sans-serif'; cx.lineWidth=8; cx.strokeText(sub,0,70); cx.fillStyle='#7cf'; cx.fillText(sub,0,70); } cx.restore(); }
  if(G.pause){ cx.fillStyle='rgba(0,0,0,.45)'; cx.fillRect(0,0,W,H); cx.fillStyle='#fff'; cx.font='900 64px system-ui'; cx.fillText('일시정지',W/2,H/2); } }
function render(){ cx.setTransform(1,0,0,1,0,0); cx.fillStyle='#ffffff'; cx.fillRect(0,0,W,H);
  if(!G) return; const sh=G.shake?(Math.random()-0.5)*G.shake:0; cx.setTransform(1,0,0,1,sh,sh*0.5);
  const fg=cx.createLinearGradient(0,GY-30,0,H); fg.addColorStop(0,'#ffffff'); fg.addColorStop(1,'#eceff3'); cx.fillStyle=fg; cx.fillRect(0,GY-20,W,H-GY+20); cx.strokeStyle='#e3e6ea'; cx.lineWidth=2; cx.beginPath(); cx.moveTo(0,GY+2); cx.lineTo(W,GY+2); cx.stroke();
  const order=[0,1].sort((a,b)=>(G.F[a].st==='atk'?1:0)-(G.F[b].st==='atk'?1:0)); order.forEach(i=>drawF(G.F[i],i));
  for(const p of G.proj){ const y=GY-p.y; const g=cx.createRadialGradient(p.x,y,4,p.x,y,40); g.addColorStop(0,'#ffffff'); g.addColorStop(0.35,'#9fe0ff'); g.addColorStop(1,'rgba(60,160,255,0)'); cx.fillStyle=g; cx.beginPath(); cx.arc(p.x,y,40,0,7); cx.fill(); }
  for(const p of G.fx){ const y=GY-p.y; cx.globalAlpha=1-p.t/p.life; if(p.ring){ cx.strokeStyle=p.col; cx.lineWidth=5; cx.beginPath(); cx.arc(p.x,y,10+p.t*5,0,7); cx.stroke(); } else { cx.fillStyle=p.col; cx.fillRect(p.x-3,y-3,6,6); } cx.globalAlpha=1; }
  for(const d of G.dmgTxt){ cx.globalAlpha=1-d.t/45; cx.font='800 28px system-ui'; cx.fillStyle='#e33'; cx.textAlign='center'; cx.fillText('-'+d.v,d.x,GY-d.y-d.t*1.2); cx.globalAlpha=1; }
  cx.setTransform(1,0,0,1,0,0); drawHUD(); }
function loop(now){ requestAnimationFrame(loop); if(G&&G.on&&!G.pause){ let dt=Math.min(100,now-G.last); G.last=now; G.acc+=dt*TSPD; while(G.acc>=1000/60){ tick(); G.acc-=1000/60; if(!G||!G.on) break; } } else if(G) G.last=now; render(); }

const PADL={bits:0};
function makePad(root,onBits){ root.innerHTML=`<div class="pad-l"><div class="stick"><div class="knob"></div></div></div><div class="pad-r">
  <button data-b="a" class="pb pa">약손<small>A</small></button><button data-b="s" class="pb ps">강손<small>S</small></button><button data-b="z" class="pb pz">약발<small>Z</small></button><button data-b="x" class="pb px">강발<small>X</small></button><button data-b="sx" class="pb pfb">기공탄<small>S+X</small></button></div>`;
  let dir=0, btn=0; const st=root.querySelector('.stick'), kn=root.querySelector('.knob'); const sticks=new Map(); const btns=new Map();
  const emit=()=>{ onBits(dir|btn); };
  const stickMove=e=>{ const r=st.getBoundingClientRect(); const cxp=r.left+r.width/2, cyp=r.top+r.height/2; let dx=e.clientX-cxp, dy=e.clientY-cyp; const R=r.width/2; const len=Math.hypot(dx,dy); if(len>R){ dx=dx/len*R; dy=dy/len*R; }
    kn.style.transform=`translate(${dx}px,${dy}px)`; const t=R*0.35; dir=(dx<-t?B.l:0)|(dx>t?B.r:0)|(dy<-t?B.u:0)|(dy>t*1.1?B.d:0); emit(); };
  const left=root.querySelector('.pad-l');
  left.addEventListener('pointerdown',e=>{ left.setPointerCapture(e.pointerId); sticks.set(e.pointerId,1); stickMove(e); e.preventDefault(); });
  left.addEventListener('pointermove',e=>{ if(sticks.has(e.pointerId)) stickMove(e); });
  const lup=e=>{ if(sticks.delete(e.pointerId)){ dir=0; kn.style.transform=''; emit(); } }; left.addEventListener('pointerup',lup); left.addEventListener('pointercancel',lup);
  root.querySelectorAll('.pb').forEach(b=>{ const k=b.dataset.b; const bit=k==='sx'?(B.s|B.x):B[k];
    b.addEventListener('pointerdown',e=>{ b.setPointerCapture(e.pointerId); btns.set(e.pointerId,bit); btn|=bit; b.classList.add('on'); emit(); e.preventDefault(); try{ navigator.vibrate&&navigator.vibrate(12); }catch(_){} });
    const up=e=>{ if(btns.has(e.pointerId)){ btns.delete(e.pointerId); btn=0; btns.forEach(v=>btn|=v); b.classList.remove('on'); emit(); } };
    b.addEventListener('pointerup',up); b.addEventListener('pointercancel',up); });
  root.addEventListener('contextmenu',e=>e.preventDefault()); }

const NETP=new Map(); // dev -> {dev,name,ch,conn,inp,ready}
const NET={peer:null,code:'',st:'',role:null,conn:null,dev:localStorage.getItem('fg-dev')||('d'+Math.random().toString(36).slice(2,10))};
localStorage.setItem('fg-dev',NET.dev);
function PeerC(){ return (typeof window.Peer==='function')?window.Peer:(window.peerjs&&window.peerjs.Peer)||null; }
function peerOpts(){ const h=QS.get('peerhost'); if(!h) return {debug:0}; const a=h.split(':'); return {debug:0,host:a[0],port:+a[1]||9000,path:'/',secure:false,config:{iceServers:[]}}; }
function mkCode(){ const A='ABCDEFGHJKLMNPQRSTUVWXYZ23456789'; let s=''; for(let i=0;i<4;i++) s+=A[Math.floor(Math.random()*A.length)]; return s; }
function hostStart(cb){ const P=PeerC(); if(!P){ NET.st='err'; cb&&cb(); return; } NET.role='host'; NET.code=mkCode(); NET.st='wait';
  const peer=new P('ofg-'+NET.code,peerOpts()); NET.peer=peer;
  peer.on('open',()=>{ NET.st='ok'; cb&&cb(); refreshUI(); });
  peer.on('error',e=>{ if(e&&e.type==='unavailable-id'){ try{ peer.destroy(); }catch(_){} hostStart(cb); return; } NET.st='err'; refreshUI(); });
  peer.on('connection',conn=>{ conn.on('data',d=>hostMsg(conn,d)); conn.on('close',()=>{ for(const [k,p] of NETP) if(p.conn===conn){ p.conn=null; p.inp=0; } refreshUI(); }); conn.on('open',()=>{ try{ conn.send({k:'hello'}); }catch(_){} }); });
  setInterval(()=>{ for(const p of NETP.values()) if(p.conn&&p.conn.open) try{ p.conn.send(stateFor(p)); }catch(_){} },400); }
function hostStop(){ try{ NET.peer&&NET.peer.destroy(); }catch(_){} NET.peer=null; NET.role=null; NETP.clear(); }
function hostMsg(conn,d){ if(!d||typeof d!=='object') return; const dev=String(d.dev||'').slice(0,20); if(!dev) return;
  let p=NETP.get(dev);
  if(d.k==='hi'){ if(!p){ if(APP.lockJoin) { try{ conn.send({k:'st',scr:'full'}); }catch(_){} return; } p={dev,name:String(d.name||'플레이어').slice(0,8),ch:d.ch==='f'?'f':'m',conn,inp:0,ready:false,win:0}; NETP.set(dev,p); snd('ui'); }
    else { p.conn=conn; if(d.name) p.name=String(d.name).slice(0,8); } refreshUI(); try{ conn.send(stateFor(p)); }catch(_){} return; }
  if(!p) return; p.conn=conn;
  if(d.k==='in'){ p.inp=(+d.b)&255; return; }
  if(d.k==='ch'){ p.ch=d.c==='f'?'f':'m'; refreshUI(); }
  if(d.k==='nm'){ p.name=String(d.n||'').slice(0,8)||p.name; refreshUI(); }
  try{ conn.send(stateFor(p)); }catch(_){} }
function stateFor(p){ const s={k:'st',name:p.name,ch:p.ch,scr:APP.scr};
  if(G&&G.on){ const i=G.p.findIndex(q=>q.ctl==='net:'+p.dev); s.play=i>=0; if(i>=0){ s.side=i; s.hp=G.F[i].hp; s.ohp=G.F[1-i].hp; s.oname=G.p[1-i].name; } else s.match=G.p.map(q=>q.name).join(' vs '); }
  if(APP.mode==='tour'&&T) { s.tour=tourText(p.dev); }
  if(APP.scr==='result') s.res=APP.resText||'';
  return s; }
function netPush(){ if(NET.role!=='host') return; for(const p of NETP.values()) if(p.conn&&p.conn.open) try{ p.conn.send(stateFor(p)); }catch(_){} }
// 폰(컨트롤러)
function clientStart(code){ const P=PeerC(); NET.role='client'; NET.code=code; NET.st='wait'; const peer=new P(peerOpts()); NET.peer=peer;
  const connect=()=>{ if(NET.role!=='client') return; const c=peer.connect('ofg-'+code,{reliable:true}); NET.conn=c;
    c.on('open',()=>{ NET.st='ok'; c.send({k:'hi',dev:NET.dev,name:CLI.name,ch:CLI.ch}); clientUI(); });
    c.on('data',d=>{ if(d&&d.k==='st'){ CLI.s=d; clientUI(); } else if(d&&d.k==='hello'){ c.send({k:'hi',dev:NET.dev,name:CLI.name,ch:CLI.ch}); } });
    c.on('close',()=>{ NET.st='lost'; clientUI(); setTimeout(connect,2000); }); };
  peer.on('open',connect); peer.on('error',e=>{ NET.st=e&&e.type==='peer-unavailable'?'nohost':'err'; clientUI(); if(e&&e.type==='peer-unavailable') setTimeout(connect,2500); });
  setInterval(()=>{ if(NET.conn&&NET.conn.open) try{ NET.conn.send({k:'in',dev:NET.dev,b:CLI.bits}); }catch(_){} },80); }

function tourRound(){ const a=shuffle(T.alive.slice()); T.bye=null; if(a.length%2===1){ T.bye=a.pop(); } T.matches=[]; for(let i=0;i<a.length;i+=2) T.matches.push({a:a[i],b:a[i+1],w:null}); T.idx=0; T.winners=[]; showBracket(true); }

  show(`<div class="menu"><div class="logo sm">🏆 토너먼트 ${T.round}라운드</div><div class="br">${T.matches.map(row).join('')}${T.bye?`<div class="mt bye" id="byeRow">🍀 부전승 복불복: <b id="byeName">${esc(tourName(T.bye))}</b></div>`:''}</div>
   <div class="mbtns row"><button class="mb b1" data-a="tnext">${T.matches[T.idx]?'▶ 다음 경기':'▶ 다음 라운드'}</button><button class="mb b5" data-a="home">🏠 그만하기</button></div></div>`);
  if(newRound&&T.bye){ const names=T.alive.map(tourName); const el=$('#byeName'); let k=0; const iv=setInterval(()=>{ if(!el.isConnected){ clearInterval(iv); return; } el.textContent=names[k++%names.length]; },70); setTimeout(()=>{ clearInterval(iv); if(el.isConnected){ el.textContent=tourName(T.bye)+' 🎉'; snd('bell'); } },1800); }
  netPush(); }
function showChamp(){ APP.scr='result'; APP.resText='🏆 우승: '+tourName(T.champ); show(`<div class="menu"><div class="logo">🏆 우승!</div><div class="champ">${esc(tourName(T.champ))}</div><div class="mbtns row"><button class="mb b1" data-a="tagain">🔁 새 토너먼트</button><button class="mb b5" data-a="home">🏠 처음으로</button></div></div>`); netPush(); }
// 폰 컨트롤러 화면
function joinUI(){ APP.scr='join'; show(`<div class="menu"><div class="logo sm">📱 폰으로 참가</div><div class="jf"><input id="jcode" maxlength="4" placeholder="코드 4자리" value="${esc((location.hash.match(/j=([A-Z0-9]{4})/i)||[])[1]||'')}"><input id="jname" maxlength="8" placeholder="이름" value="${esc(CLI.name)}">
  <div class="chars sm"><button class="cc ${CLI.ch==='m'?'on':''}" data-a="cch" data-c="m">${charImg('m')}<b>${CH.m.name}</b></button><button class="cc ${CLI.ch==='f'?'on':''}" data-a="cch" data-c="f">${charImg('f')}<b>${CH.f.name}</b></button></div>
  <button class="mb b1" data-a="jgo">연결하기</button></div><button class="mb sm" data-a="home">← 처음으로</button></div>`); }
function clientUI(){ if(APP.scr!=='pad') return; const s=CLI.s||{}; const st=$('#cst'); if(!st) return;
  st.innerHTML=NET.st!=='ok'?(NET.st==='nohost'?'🔎 방을 찾는 중… 코드를 확인해 주세요':'⏳ 연결 중…'):
    s.scr==='fight'&&s.play?`⚔️ 경기 중 · 나 ${Math.ceil((s.hp||0)/10)}% vs ${esc(s.oname||'')} ${Math.ceil((s.ohp||0)/10)}%`:
    s.scr==='fight'?`👀 관전 중 · ${esc(s.match||'')}`: s.scr==='result'?esc(s.res||'경기 끝'): s.tour?esc(s.tour): `✅ 연결됨 · ${esc(s.name||CLI.name)} (${CH[s.ch||CLI.ch].name}) · 메인 화면에서 시작을 기다려요`;
  $('#cpad').classList.toggle('dim',!(s.scr==='fight'&&s.play)); }
function padUI(){ APP.scr='pad'; show(`<div class="cli"><div id="cst" class="cst">⏳ 연결 중…</div><div class="cbtns"><button class="ib" data-a="cchg">🔄 캐릭터</button><button class="ib" data-a="fs">⛶</button></div><div id="cpad" class="padbox"></div></div>`);
  makePad($('#cpad'),b=>{ CLI.bits=b; if(NET.conn&&NET.conn.open) try{ NET.conn.send({k:'in',dev:NET.dev,b}); }catch(_){} }); clientUI(); }
// 버튼
ui.addEventListener('click',e=>{ const el=e.target.closest('[data-a]'); if(!el||el.disabled) return; ac(); snd('ui'); const a=el.dataset.a;
  if(a==='home'){ if(G) G.on=false; if(NET.role) hostStop(); APP.roster=[]; T=null; $('#padwrap').style.display='none'; titleUI(); }
  else if(a==='m1'){ APP.mode='solo'; selectUI(ch=>{ const cpu=Math.random()<0.5?'m':'f'; const go=()=>startFight([{name:'나',ch,ctl:isTouch?'pad':'kb'},{name:'컴퓨터',ch:cpu,ctl:'cpu'}],2,res=>resultUI(res,go)); go(); },'1인용 · 캐릭터 선택'); }
  else if(a==='pick'){ const cb=APP.onPick; cb&&cb(el.dataset.c); }
  else if(a==='m2'||a==='m3'){ APP.mode=a==='m2'?'duo':'tour'; APP.roster=[]; APP.best=a==='m2'?2:1; hostStart(()=>lobbyUI()); lobbyUI(); }
  else if(a==='m4') storyUI();
  else if(a==='join') joinUI();
  else if(a==='addkb'){ if(APP.roster.some(r=>r.ctl==='kb'||r.ctl==='pad')) return; APP.roster.unshift({id:'local',name:'메인',ch:'m',ctl:isTouch?'pad':'kb'}); lobbyUI(); }
  else if(a==='addcpu'){ const n=APP.roster.filter(r=>r.ctl==='cpu').length+1; APP.roster.push({id:'cpu'+n+Math.random().toString(36).slice(2,5),name:'컴퓨터'+n,ch:Math.random()<.5?'m':'f',ctl:'cpu'}); lobbyUI(); }
  else if(a==='kick'){ const r=APP.roster[+el.dataset.i]; if(r){ if(r.ctl.startsWith('net:')) NETP.delete(r.id); APP.roster.splice(+el.dataset.i,1); } lobbyUI(); }
  else if(a==='best'){ APP.best=+el.dataset.v; lobbyUI(); }
  else if(a==='lstart'){ if(APP.mode==='duo'){ const go=()=>startFight(APP.roster.slice(0,2),APP.best,res=>resultUI(res,go)); go(); } else tourStart(); }
  else if(a==='tnext') tourNext();
  else if(a==='tagain') tourStart();
  else if(a==='again'){ const g=APP.again; g&&g(); }
  else if(a==='cch'){ const nm=$('#jname'), cd=$('#jcode'); CLI.name=(nm&&nm.value||CLI.name).slice(0,8); const code=cd?cd.value:''; CLI.ch=el.dataset.c; localStorage.setItem('fg-ch',CLI.ch); joinUI(); if(code&&$('#jcode')) $('#jcode').value=code; }
  else if(a==='jgo'){ const code=($('#jcode').value||'').trim().toUpperCase(); CLI.name=($('#jname').value||'').trim().slice(0,8)||'플레이어'; localStorage.setItem('fg-name',CLI.name); if(!/^[A-Z0-9]{4}$/.test(code)) return alert('4자리 코드를 입력해 주세요'); padUI(); clientStart(code); goFull(); }
  else if(a==='cchg'){ CLI.ch=CLI.ch==='m'?'f':'m'; localStorage.setItem('fg-ch',CLI.ch); clSend({k:'ch',c:CLI.ch}); }
  else if(a==='fs') goFull();
});
// 호스트: 넷 플레이어 목록 동기화
setInterval(()=>{ if(NET.role==='host'&&APP.scr==='lobby'){ const before=JSON.stringify(APP.roster.map(r=>[r.id,r.name,r.ch,r.conn])); syncRoster(); if(JSON.stringify(APP.roster.map(r=>[r.id,r.name,r.ch,r.conn]))!==before) lobbyUI(); } },500);
function goFull(){ const d=document.documentElement; try{ (d.requestFullscreen||d.webkitRequestFullscreen).call(d).then(()=>{ try{ screen.orientation.lock('landscape').catch(()=>{}); }catch(_){} }).catch(()=>{}); }catch(_){} }
// 화면 비율 16:9 맞추기
function fit(){ const s=$('#stage'); const sw=innerWidth, sh=innerHeight; const k=Math.min(sw/W,sh/H); s.style.transform=`translate(-50%,-50%) scale(${k})`; $('#rot').style.display=(isTouch&&sh>sw)?'flex':'none'; }
addEventListener('resize',fit); addEventListener('orientationchange',()=>setTimeout(fit,200));
// 시작
loadImgs(()=>{ fit(); if(isTouch) makePad($('#padwrap'),b=>{ PADL.bits=b; }); const m=location.hash.match(/j=([A-Z0-9]{4})/i); if(m){ joinUI(); } else titleUI(); requestAnimationFrame(loop); });
window.__fg={get G(){ return G; },APP,NETP,KB,T:()=>T,startFight,tourStart};

</script>
</body></html>
