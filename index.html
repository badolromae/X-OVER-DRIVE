var qrcode = function() {

  //---------------------------------------------------------------------
  // qrcode
  //---------------------------------------------------------------------

  /**
   * qrcode
   * @param typeNumber 1 to 40
   * @param errorCorrectionLevel 'L','M','Q','H'
   */
  var qrcode = function(typeNumber, errorCorrectionLevel) {

    var PAD0 = 0xEC;
    var PAD1 = 0x11;

    var _typeNumber = typeNumber;
    var _errorCorrectionLevel = QRErrorCorrectionLevel[errorCorrectionLevel];
    var _modules = null;
    var _moduleCount = 0;
    var _dataCache = null;
    var _dataList = [];

    var _this = {};

    var makeImpl = function(test, maskPattern) {

      _moduleCount = _typeNumber * 4 + 17;
      _modules = function(moduleCount) {
        var modules = new Array(moduleCount);
        for (var row = 0; row < moduleCount; row += 1) {
          modules[row] = new Array(moduleCount);
          for (var col = 0; col < moduleCount; col += 1) {
            modules[row][col] = null;
          }
        }
        return modules;
      }(_moduleCount);

      setupPositionProbePattern(0, 0);
      setupPositionProbePattern(_moduleCount - 7, 0);
      setupPositionProbePattern(0, _moduleCount - 7);
      setupPositionAdjustPattern();
      setupTimingPattern();
      setupTypeInfo(test, maskPattern);

      if (_typeNumber >= 7) {
        setupTypeNumber(test);
      }

      if (_dataCache == null) {
        _dataCache = createData(_typeNumber, _errorCorrectionLevel, _dataList);
      }

      mapData(_dataCache, maskPattern);
    };

    var setupPositionProbePattern = function(row, col) {

      for (var r = -1; r <= 7; r += 1) {

        if (row + r <= -1 || _moduleCount <= row + r) continue;

        for (var c = -1; c <= 7; c += 1) {

          if (col + c <= -1 || _moduleCount <= col + c) continue;

          if ( (0 <= r && r <= 6 && (c == 0 || c == 6) )
              || (0 <= c && c <= 6 && (r == 0 || r == 6) )
              || (2 <= r && r <= 4 && 2 <= c && c <= 4) ) {
            _modules[row + r][col + c] = true;
          } else {
            _modules[row + r][col + c] = false;
          }
        }
      }
    };

    var getBestMaskPattern = function() {

      var minLostPoint = 0;
      var pattern = 0;

      for (var i = 0; i < 8; i += 1) {

        makeImpl(true, i);

        var lostPoint = QRUtil.getLostPoint(_this);

        if (i == 0 || minLostPoint > lostPoint) {
          minLostPoint = lostPoint;
          pattern = i;
        }
      }

      return pattern;
    };

    var setupTimingPattern = function() {

      for (var r = 8; r < _moduleCount - 8; r += 1) {
        if (_modules[r][6] != null) {
          continue;
        }
        _modules[r][6] = (r % 2 == 0);
      }

      for (var c = 8; c < _moduleCount - 8; c += 1) {
        if (_modules[6][c] != null) {
          continue;
        }
        _modules[6][c] = (c % 2 == 0);
      }
    };

    var setupPositionAdjustPattern = function() {

      var pos = QRUtil.getPatternPosition(_typeNumber);

      for (var i = 0; i < pos.length; i += 1) {

        for (var j = 0; j < pos.length; j += 1) {

          var row = pos[i];
          var col = pos[j];

          if (_modules[row][col] != null) {
            continue;
          }

          for (var r = -2; r <= 2; r += 1) {

            for (var c = -2; c <= 2; c += 1) {

              if (r == -2 || r == 2 || c == -2 || c == 2
                  || (r == 0 && c == 0) ) {
                _modules[row + r][col + c] = true;
              } else {
                _modules[row + r][col + c] = false;
              }
            }
          }
        }
      }
    };

    var setupTypeNumber = function(test) {

      var bits = QRUtil.getBCHTypeNumber(_typeNumber);

      for (var i = 0; i < 18; i += 1) {
        var mod = (!test && ( (bits >> i) & 1) == 1);
        _modules[Math.floor(i / 3)][i % 3 + _moduleCount - 8 - 3] = mod;
      }

      for (var i = 0; i < 18; i += 1) {
        var mod = (!test && ( (bits >> i) & 1) == 1);
        _modules[i % 3 + _moduleCount - 8 - 3][Math.floor(i / 3)] = mod;
      }
    };

    var setupTypeInfo = function(test, maskPattern) {

      var data = (_errorCorrectionLevel << 3) | maskPattern;
      var bits = QRUtil.getBCHTypeInfo(data);

      // vertical
      for (var i = 0; i < 15; i += 1) {

        var mod = (!test && ( (bits >> i) & 1) == 1);

        if (i < 6) {
          _modules[i][8] = mod;
        } else if (i < 8) {
          _modules[i + 1][8] = mod;
        } else {
          _modules[_moduleCount - 15 + i][8] = mod;
        }
      }

      // horizontal
      for (var i = 0; i < 15; i += 1) {

        var mod = (!test && ( (bits >> i) & 1) == 1);

        if (i < 8) {
          _modules[8][_moduleCount - i - 1] = mod;
        } else if (i < 9) {
          _modules[8][15 - i - 1 + 1] = mod;
        } else {
          _modules[8][15 - i - 1] = mod;
        }
      }

      // fixed module
      _modules[_moduleCount - 8][8] = (!test);
    };

    var mapData = function(data, maskPattern) {

      var inc = -1;
      var row = _moduleCount - 1;
      var bitIndex = 7;
      var byteIndex = 0;
      var maskFunc = QRUtil.getMaskFunction(maskPattern);

      for (var col = _moduleCount - 1; col > 0; col -= 2) {

        if (col == 6) col -= 1;

        while (true) {

          for (var c = 0; c < 2; c += 1) {

            if (_modules[row][col - c] == null) {

              var dark = false;

              if (byteIndex < data.length) {
                dark = ( ( (data[byteIndex] >>> bitIndex) & 1) == 1);
              }

              var mask = maskFunc(row, col - c);

              if (mask) {
                dark = !dark;
              }

              _modules[row][col - c] = dark;
              bitIndex -= 1;

              if (bitIndex == -1) {
                byteIndex += 1;
                bitIndex = 7;
              }

          row += inc;

          if (row < 0 || _moduleCount <= row) {
            row -= inc;
            inc = -inc;
            break;
          }
        }

    var createBytes = function(buffer, rsBlocks) {

      var offset = 0;

      var maxDcCount = 0;
      var maxEcCount = 0;

      var dcdata = new Array(rsBlocks.length);
      var ecdata = new Array(rsBlocks.length);

        var ecCount = rsBlocks[r].totalCount - dcCount;

        maxEcCount = Math.max(maxEcCount, ecCount);

        dcdata[r] = new Array(dcCount);

        for (var i = 0; i < dcdata[r].length; i += 1) {
          dcdata[r][i] = 0xff & buffer.getBuffer()[i + offset];
        }
        offset += dcCount;

        var rsPoly = QRUtil.getErrorCorrectPolynomial(ecCount);
        var rawPoly = qrPolynomial(dcdata[r], rsPoly.getLength() - 1);

        var modPoly = rawPoly.mod(rsPoly);
        ecdata[r] = new Array(rsPoly.getLength() - 1);
        for (var i = 0; i < ecdata[r].length; i += 1) {
          var modIndex = i + modPoly.getLength() - ecdata[r].length;
          ecdata[r][i] = (modIndex >= 0)? modPoly.getAt(modIndex) : 0;
        }
      }

      var totalCodeCount = 0;
      for (var i = 0; i < rsBlocks.length; i += 1) {
        totalCodeCount += rsBlocks[i].totalCount;
      }

      var data = new Array(totalCodeCount);
      var index = 0;

      for (var i = 0; i < maxDcCount; i += 1) {
        for (var r = 0; r < rsBlocks.length; r += 1) {
          if (i < dcdata[r].length) {
            data[index] = dcdata[r][i];
            index += 1;
          }
        }
      }

      for (var i = 0; i < maxEcCount; i += 1) {
        for (var r = 0; r < rsBlocks.length; r += 1) {
          if (i < ecdata[r].length) {
            data[index] = ecdata[r][i];
            index += 1;
          }
        }
      }

      return data;
    };

    var createData = function(typeNumber, errorCorrectionLevel, dataList) {

      var rsBlocks = QRRSBlock.getRSBlocks(typeNumber, errorCorrectionLevel);

      var buffer = qrBitBuffer();

      for (var i = 0; i < dataList.length; i += 1) {
        var data = dataList[i];
        buffer.put(data.getMode(), 4);
        buffer.put(data.getLength(), QRUtil.getLengthInBits(data.getMode(), typeNumber) );
        data.write(buffer);
      }

      // calc num max data.
      var totalDataCount = 0;
      for (var i = 0; i < rsBlocks.length; i += 1) {
        totalDataCount += rsBlocks[i].dataCount;
      }

      if (buffer.getLengthInBits() > totalDataCount * 8) {
        throw 'code length overflow. ('
          + buffer.getLengthInBits()
          + '>'
          + totalDataCount * 8
          + ')';
      }

      // end code
      if (buffer.getLengthInBits() + 4 <= totalDataCount * 8) {
        buffer.put(0, 4);
      }

      // padding
      while (buffer.getLengthInBits() % 8 != 0) {
        buffer.putBit(false);
      }

      // padding
      while (true) {

        if (buffer.getLengthInBits() >= totalDataCount * 8) {
          break;
        }
        buffer.put(PAD0, 8);

        if (buffer.getLengthInBits() >= totalDataCount * 8) {
          break;
        }
        buffer.put(PAD1, 8);
      }

      return createBytes(buffer, rsBlocks);
    };

    _this.addData = function(data, mode) {

      mode = mode || 'Byte';

      var newData = null;

      switch(mode) {
      case 'Numeric' :
        newData = qrNumber(data);
        break;
      case 'Alphanumeric' :
        newData = qrAlphaNum(data);
        break;
      case 'Byte' :
        newData = qr8BitByte(data);
        break;
      case 'Kanji' :
        newData = qrKanji(data);
        break;
      default :
        throw 'mode:' + mode;
      }

      _dataList.push(newData);
      _dataCache = null;
    };

    _this.isDark = function(row, col) {
      if (row < 0 || _moduleCount <= row || col < 0 || _moduleCount <= col) {
        throw row + ',' + col;
      }
      return _modules[row][col];
    };

    _this.getModuleCount = function() {
      return _moduleCount;
    };

    _this.make = function() {
      if (_typeNumber < 1) {
        var typeNumber = 1;

        for (; typeNumber < 40; typeNumber++) {
          var rsBlocks = QRRSBlock.getRSBlocks(typeNumber, _errorCorrectionLevel);
          var buffer = qrBitBuffer();

          for (var i = 0; i < _dataList.length; i++) {
            var data = _dataList[i];
            buffer.put(data.getMode(), 4);
            buffer.put(data.getLength(), QRUtil.getLengthInBits(data.getMode(), typeNumber) );
            data.write(buffer);
          }

          var totalDataCount = 0;
          for (var i = 0; i < rsBlocks.length; i++) {
            totalDataCount += rsBlocks[i].dataCount;
          }

          if (buffer.getLengthInBits() <= totalDataCount * 8) {
            break;
          }
        }

        _typeNumber = typeNumber;
      }

      makeImpl(false, getBestMaskPattern() );
    };

    _this.createTableTag = function(cellSize, margin) {

      cellSize = cellSize || 2;
      margin = (typeof margin == 'undefined')? cellSize * 4 : margin;

      var qrHtml = '';

      qrHtml += '<table style="';
      qrHtml += ' border-width: 0px; border-style: none;';
      qrHtml += ' border-collapse: collapse;';
      qrHtml += ' padding: 0px; margin: ' + margin + 'px;';
      qrHtml += '">';
      qrHtml += '<tbody>';

      for (var r = 0; r < _this.getModuleCount(); r += 1) {

        qrHtml += '<tr>';

        for (var c = 0; c < _this.getModuleCount(); c += 1) {
          qrHtml += '<td style="';
          qrHtml += ' border-width: 0px; border-style: none;';
          qrHtml += ' border-collapse: collapse;';
          qrHtml += ' padding: 0px; margin: 0px;';
          qrHtml += ' width: ' + cellSize + 'px;';
          qrHtml += ' height: ' + cellSize + 'px;';
          qrHtml += ' background-color: ';
          qrHtml += _this.isDark(r, c)? '#000000' : '#ffffff';
          qrHtml += ';';
          qrHtml += '"/>';
        }

        qrHtml += '</tr>';
      }

      qrHtml += '</tbody>';
      qrHtml += '</table>';

      return qrHtml;
    };

        // overwrite cellSize and margin.

        margin = opts.margin;
        alt = opts.alt;
        title = opts.title;

      margin = (typeof margin == 'undefined')? cellSize * 4 : margin;

      alt.text = alt.text || null;
      alt.id = (alt.text) ? alt.id || 'qrcode-description' : null;

      title = (typeof title === 'string') ? {text: title} : title || {};
      title.text = title.text || null;
      title.id = (title.text) ? title.id || 'qrcode-title' : null;

      var c, mc, r, mr, qrSvg='', rect;

        ' -' + cellSize + ',0 0,-' + cellSize + 'z ';

      qrSvg += '<svg version="1.1" xmlns="http://www.w3.org/2000/svg"';
      qrSvg += !opts.scalable ? ' width="' + size + 'px" height="' + size + 'px"' : '';
      qrSvg += ' viewBox="0 0 ' + size + ' ' + size + '" ';
      qrSvg += ' preserveAspectRatio="xMinYMin meet"';
      qrSvg += (title.text || alt.text) ? ' role="img" aria-labelledby="' +
          escapeXml([title.id, alt.id].join(' ').trim() ) + '"' : '';
      qrSvg += '>';
      qrSvg += (title.text) ? '<title id="' + escapeXml(title.id) + '">' +

function makePad(root,onBits){ root.innerHTML=`<div class="pad-l"><div class="stick"><div class="knob"></div></div></div><div class="pad-r">
  <button data-b="a" class="pb pa">약손<small>A</small></button><button data-b="s" class="pb ps">강손<small>S</small></button><button data-b="z" class="pb pz">약발<small>Z</small></button><button data-b="x" class="pb px">강발<small>X</small></button></div><div class="pad-c"><button data-b="sx" class="pc">⚡기공탄</button><button data-b="zx" class="pc">🌀구르기</button><button data-b="as" class="pc">🔄반격</button><button data-b="az" class="pc">🔋충전</button><button data-b="ax" class="pc">😜도발</button></div>`;
  let dir=0, btn=0; const st=root.querySelector('.stick'), kn=root.querySelector('.knob'); const sticks=new Map(); const btns=new Map();
  const emit=()=>{ onBits(dir|btn); };
  const stickMove=e=>{ const r=st.getBoundingClientRect(); const cxp=r.left+r.width/2, cyp=r.top+r.height/2; let dx=e.clientX-cxp, dy=e.clientY-cyp; const R=r.width/2; const len=Math.hypot(dx,dy); if(len>R){ dx=dx/len*R; dy=dy/len*R; }
    kn.style.transform=`translate(${dx}px,${dy}px)`; const t=R*0.35; dir=(dx<-t?B.l:0)|(dx>t?B.r:0)|(dy<-t?B.u:0)|(dy>t*1.1?B.d:0); emit(); };
  const left=root.querySelector('.pad-l');
  left.addEventListener('pointerdown',e=>{ left.setPointerCapture(e.pointerId); sticks.set(e.pointerId,1); stickMove(e); e.preventDefault(); });
  left.addEventListener('pointermove',e=>{ if(sticks.has(e.pointerId)) stickMove(e); });
  const lup=e=>{ if(sticks.delete(e.pointerId)){ dir=0; kn.style.transform=''; emit(); } }; left.addEventListener('pointerup',lup); left.addEventListener('pointercancel',lup);
  root.querySelectorAll('.pb,.pc').forEach(b=>{ const k=b.dataset.b; const bit=k.length===2?(B[k[0]]|B[k[1]]):B[k];
    b.addEventListener('pointerdown',e=>{ b.setPointerCapture(e.pointerId); btns.set(e.pointerId,bit); btn|=bit; b.classList.add('on'); emit(); e.preventDefault(); try{ navigator.vibrate&&navigator.vibrate(12); }catch(_){} });
    const up=e=>{ if(btns.has(e.pointerId)){ btns.delete(e.pointerId); btn=0; btns.forEach(v=>btn|=v); b.classList.remove('on'); emit(); } };
    b.addEventListener('pointerup',up); b.addEventListener('pointercancel',up); });
  root.addEventListener('contextmenu',e=>e.preventDefault()); }

const NETP=new Map(); // dev -> {dev,name,ch,conn,inp,ready}
const NET={peer:null,code:'',st:'',role:null,conn:null,dev:localStorage.getItem('fg-dev')||('d'+Math.random().toString(36).slice(2,10))};
localStorage.setItem('fg-dev',NET.dev);
function PeerC(){ return (typeof window.Peer==='function')?window.Peer:(window.peerjs&&window.peerjs.Peer)||null; }
function peerOpts(){ const h=QS.get('peerhost'); if(!h) return {debug:0}; const a=h.split(':'); return {debug:0,host:a[0],port:+a[1]||9000,path:'/',secure:false,config:{iceServers:[]}}; }
function mkCode(){ const A='ABCDEFGHJKLMNPQRSTUVWXYZ23456789'; let s=''; for(let i=0;i<4;i++) s+=A[Math.floor(Math.random()*A.length)]; return s; }
function hostStart(cb){ const P=PeerC(); if(!P){ NET.st='err'; cb&&cb(); return; } NET.role='host'; NET.code=mkCode(); NET.st='wait';
  const peer=new P('ofg-'+NET.code,peerOpts()); NET.peer=peer;
  peer.on('open',()=>{ NET.st='ok'; cb&&cb(); refreshUI(); });
  peer.on('error',e=>{ if(e&&e.type==='unavailable-id'){ try{ peer.destroy(); }catch(_){} hostStart(cb); return; } NET.st='err'; refreshUI(); });
  peer.on('connection',conn=>{ conn.on('data',d=>hostMsg(conn,d)); conn.on('close',()=>{ for(const [k,p] of NETP) if(p.conn===conn){ p.conn=null; p.inp=0; } refreshUI(); }); conn.on('open',()=>{ try{ conn.send({k:'hello'}); }catch(_){} }); });
  setInterval(()=>{ for(const p of NETP.values()) if(p.conn&&p.conn.open) try{ p.conn.send(stateFor(p)); }catch(_){} },400); }
function hostStop(){ try{ NET.peer&&NET.peer.destroy(); }catch(_){} NET.peer=null; NET.role=null; NETP.clear(); }
function hostMsg(conn,d){ if(!d||typeof d!=='object') return; const dev=String(d.dev||'').slice(0,20); if(!dev) return;
  let p=NETP.get(dev);
  if(d.k==='hi'){ if(!p){ if(APP.lockJoin) { try{ conn.send({k:'st',scr:'full'}); }catch(_){} return; } p={dev,name:String(d.name||'플레이어').slice(0,8),ch:d.ch==='f'?'f':'m',conn,inp:0,ready:false,win:0}; NETP.set(dev,p); snd('ui'); }
    else { p.conn=conn; if(d.name) p.name=String(d.name).slice(0,8); } refreshUI(); try{ conn.send(stateFor(p)); }catch(_){} return; }
  if(!p) return; p.conn=conn;
  if(d.k==='in'){ p.inp=(+d.b)&255; p.latch=(p.latch||0)|p.inp; return; }
  if(d.k==='ch'){ p.ch=d.c==='f'?'f':'m'; refreshUI(); }
  if(d.k==='nm'){ p.name=String(d.n||'').slice(0,8)||p.name; refreshUI(); }
  try{ conn.send(stateFor(p)); }catch(_){} }
function stateFor(p){ const s={k:'st',name:p.name,ch:p.ch,scr:APP.scr};
  if(G&&G.on){ const i=G.p.findIndex(q=>q.ctl==='net:'+p.dev); s.play=i>=0; if(i>=0){ s.side=i; s.hp=G.F[i].hp; s.ohp=G.F[1-i].hp; s.oname=G.p[1-i].name; } else s.match=G.p.map(q=>q.name).join(' vs '); }
  if(APP.mode==='tour'&&T) { s.tour=tourText(p.dev); }

  return s; }
function netPush(){ if(NET.role!=='host') return; for(const p of NETP.values()) if(p.conn&&p.conn.open) try{ p.conn.send(stateFor(p)); }catch(_){} }
// 폰(컨트롤러)
function clientStart(code){ const P=PeerC(); NET.role='client'; NET.code=code; NET.st='wait'; const peer=new P(peerOpts()); NET.peer=peer;
  const connect=()=>{ if(NET.role!=='client') return; const c=peer.connect('ofg-'+code,{reliable:true}); NET.conn=c;
    c.on('open',()=>{ NET.st='ok'; c.send({k:'hi',dev:NET.dev,name:CLI.name,ch:CLI.ch}); clientUI(); });
    c.on('data',d=>{ if(d&&d.k==='st'){ CLI.s=d; clientUI(); } else if(d&&d.k==='hello'){ c.send({k:'hi',dev:NET.dev,name:CLI.name,ch:CLI.ch}); } });
    c.on('close',()=>{ NET.st='lost'; clientUI(); setTimeout(connect,2000); }); };
  peer.on('open',connect); peer.on('error',e=>{ NET.st=e&&e.type==='peer-unavailable'?'nohost':'err'; clientUI(); if(e&&e.type==='peer-unavailable') setTimeout(connect,2500); });
  setInterval(()=>{ if(NET.conn&&NET.conn.open) try{ NET.conn.send({k:'in',dev:NET.dev,b:CLI.bits}); }catch(_){} },80); }

let T=null;
function tourStart(){ const ids=[...APP.roster.map(r=>r.id)]; T={round:1,alive:ids,matches:[],done:[],bye:null,idx:0,champ:null,log:[]}; tourRound(); }
function shuffle(a){ for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }
function tourRound(){ const a=shuffle(T.alive.slice()); T.bye=null; if(a.length%2===1){ T.bye=a.pop(); } T.matches=[]; for(let i=0;i<a.length;i+=2) T.matches.push({a:a[i],b:a[i+1],w:null}); T.idx=0; T.winners=[]; showBracket(true); }
function tourName(id){ const r=APP.roster.find(x=>x.id===id); return r?r.name:'?'; }
function tourText(dev){ if(!T) return ''; if(T.champ) return T.champ===dev?'🏆 우승!':'🏆 우승: '+tourName(T.champ); const m=T.matches[T.idx]; if(!m) return ''; if(m.a===dev||m.b===dev) return '⚔️ 지금 내 경기!'; if(T.bye===dev) return '🍀 이번 라운드 부전승!'; return `👀 관전 중: ${tourName(m.a)} vs ${tourName(m.b)}`; }
function tourNext(){ const m=T.matches[T.idx]; if(!m){ T.alive=T.winners.concat(T.bye?[T.bye]:[]); if(T.alive.length<=1){ T.champ=T.alive[0]; showChamp(); return; } T.round++; tourRound(); return; }
  const ra=APP.roster.find(r=>r.id===m.a), rb=APP.roster.find(r=>r.id===m.b);
  startFight([ra,rb],APP.best,res=>{ m.w=res.w===0?m.a:m.b; T.winners.push(m.w); T.idx++; setTimeout(()=>showBracket(false),1800); }); }

  show(`<div class="menu"><div class="logo sm">🏆 ${esc(w.name)} 승리!</div><div class="score">${esc(res.p[0].name)} <b>${res.wins[0]} : ${res.wins[1]}</b> ${esc(res.p[1].name)}</div>
  <div class="mbtns row"><button class="mb b1" data-a="again">🔁 다시 하기</button><button class="mb b5" data-a="home">🏠 처음으로</button></div></div>`); APP.again=again; netPush(); }
function moveListHTML(){ return `<div class="ml">${LIST.map(([cat,rows])=>`<div class="mlc"><b>${cat}</b>${rows.map(r=>`<div class="mlr"><span>${esc(r[0])}</span><em>${esc(r[1])}</em></div>`).join('')}</div>`).join('')}</div><div class="mlh">→ = 상대 쪽(앞) · ← = 뒤 · 두 버튼은 거의 동시에 · 기 게이지는 때리거나 맞거나 충전하면 차요</div>`; }
function moveListUI(fromPause){ APP.mlBack=fromPause?'pause':APP.scr; show(`<div class="menu"><div class="logo sm">📜 기술표</div>${moveListHTML()}<button class="mb b1 sm" data-a="mclose">${fromPause?'▶ 계속하기':'← 돌아가기'}</button></div>`); }
function storyUI(){ APP.scr='story'; show(`<div class="menu"><div class="logo sm">📖 스토리 모드</div><div class="uc">🚧<b>공사 중이에요!</b><small>준호와 서연의 이야기가 곧 찾아옵니다</small></div><button class="mb sm" data-a="home">← 처음으로</button></div>`); }
function lobbyUI(){ APP.scr='lobby'; const tour=APP.mode==='tour'; const players=APP.roster; const url=location.href.split('#')[0]+'#j='+NET.code;
  const need=tour?2:2; const ok=tour?players.length>=2:players.length===2;
  show(`<div class="menu lobby"><div class="logo sm">${tour?'🏆 토너먼트 로비':'👥 2인용 로비'}</div><div class="lob">
   <div class="qr"><div id="qrbox"></div><div class="code">${NET.code||'····'}</div><small>${NET.st==='ok'?'✅ 폰 카메라로 QR을 찍거나<br>코드를 입력해 참가해요':NET.st==='err'?'⚠️ 연결 서버 오류':'⏳ 연결 준비 중…'}</small>${location.protocol==='file:'?'<small class="warn">파일로 연 상태라 QR 링크는 폰에서 안 열려요 (코드 입력은 가능)</small>':''}</div>
   <div class="plist"><b>참가자 ${players.length}${tour?'명':' / 2명'}</b>${players.map((r,i)=>`<div class="pl"><span class="dot" style="background:${r.ctl==='kb'?'#888':'#3b82f6'}"></span>${esc(r.name)} · ${CH[r.ch].name} <small>${r.ctl==='kb'?'⌨️ 이 기기':r.ctl==='cpu'?'🤖 컴퓨터':'📱 폰'}${r.conn===false?' (끊김)':''}</small><button class="x" data-a="kick" data-i="${i}">✕</button></div>`).join('')||'<div class="pl dim">폰 연결을 기다리는 중…</div>'}
   <div class="lbtns">${!isTouch||true?`<button class="mb sm" data-a="addkb">⌨️ 이 기기로 참가</button>`:''}<button class="mb sm" data-a="addcpu">🤖 컴퓨터 추가</button></div>
   <div class="set">경기 방식: <button class="seg ${APP.best===1?'on':''}" data-a="best" data-v="1">1판</button><button class="seg ${APP.best===2?'on':''}" data-a="best" data-v="2">3판 2선승</button></div></div></div>
   <div class="mbtns row"><button class="mb b1" data-a="lstart" ${ok?'':'disabled'}>${ok?'⚔️ 시작!':tour?'2명 이상 모이면 시작':'2명이 모이면 시작'}</button><button class="mb b5" data-a="home">🏠 처음으로</button></div></div>`);
  const qb=$('#qrbox'); if(qb&&NET.code){ try{ const q=qrcode(0,'M'); q.addData(url); q.make(); qb.innerHTML=q.createSvgTag({cellSize:4,margin:2}); }catch(e){} } }
function syncRoster(){ // NETP → roster
  const keep=APP.roster.filter(r=>!String(r.ctl).startsWith('net:')); const nets=[...NETP.values()].map(p=>({id:p.dev,name:p.name,ch:p.ch,ctl:'net:'+p.dev,conn:!!(p.conn&&p.conn.open)}));
  APP.roster=keep.concat(nets).slice(0,APP.mode==='tour'?16:2); }
function showBracket(newRound){ APP.scr='bracket'; $('#padwrap').style.display='none';
  const row=m=>`<div class="mt ${T.matches.indexOf(m)===T.idx?'cur':''}"><span class="${m.w===m.a?'w':''}">${esc(tourName(m.a))}</span><em>VS</em><span class="${m.w===m.b?'w':''}">${esc(tourName(m.b))}</span>${m.w?'<i>✔</i>':''}</div>`;
  show(`<div class="menu"><div class="logo sm">🏆 토너먼트 ${T.round}라운드</div><div class="br">${T.matches.map(row).join('')}${T.bye?`<div class="mt bye" id="byeRow">🍀 부전승 복불복: <b id="byeName">${esc(tourName(T.bye))}</b></div>`:''}</div>
   <div class="mbtns row"><button class="mb b1" data-a="tnext">${T.matches[T.idx]?'▶ 다음 경기':'▶ 다음 라운드'}</button><button class="mb b5" data-a="home">🏠 그만하기</button></div></div>`);
  if(newRound&&T.bye){ const names=T.alive.map(tourName); const el=$('#byeName'); let k=0; const iv=setInterval(()=>{ if(!el.isConnected){ clearInterval(iv); return; } el.textContent=names[k++%names.length]; },70); setTimeout(()=>{ clearInterval(iv); if(el.isConnected){ el.textContent=tourName(T.bye)+' 🎉'; snd('bell'); } },1800); }
  netPush(); }
function showChamp(){ APP.scr='result'; APP.resText='🏆 우승: '+tourName(T.champ); show(`<div class="menu"><div class="logo">🏆 우승!</div><div class="champ">${esc(tourName(T.champ))}</div><div class="mbtns row"><button class="mb b1" data-a="tagain">🔁 새 토너먼트</button><button class="mb b5" data-a="home">🏠 처음으로</button></div></div>`); netPush(); }
// 폰 컨트롤러 화면
function joinUI(){ APP.scr='join'; show(`<div class="menu"><div class="logo sm">📱 폰으로 참가</div><div class="jf"><input id="jcode" maxlength="4" placeholder="코드 4자리" value="${esc((location.hash.match(/j=([A-Z0-9]{4})/i)||[])[1]||'')}"><input id="jname" maxlength="8" placeholder="이름" value="${esc(CLI.name)}">
  <div class="chars sm"><button class="cc ${CLI.ch==='m'?'on':''}" data-a="cch" data-c="m">${charImg('m')}<b>${CH.m.name}</b></button><button class="cc ${CLI.ch==='f'?'on':''}" data-a="cch" data-c="f">${charImg('f')}<b>${CH.f.name}</b></button></div>
  <button class="mb b1" data-a="jgo">연결하기</button></div><button class="mb sm" data-a="home">← 처음으로</button></div>`); }
function clientUI(){ if(APP.scr!=='pad') return; const s=CLI.s||{}; const st=$('#cst'); if(!st) return;
  st.innerHTML=NET.st!=='ok'?(NET.st==='nohost'?'🔎 방을 찾는 중… 코드를 확인해 주세요':'⏳ 연결 중…'):
    s.scr==='fight'&&s.play?`⚔️ 경기 중 · 나 ${Math.ceil((s.hp||0)/10)}% vs ${esc(s.oname||'')} ${Math.ceil((s.ohp||0)/10)}%`:
    s.scr==='fight'?`👀 관전 중 · ${esc(s.match||'')}`: s.scr==='result'?esc(s.res||'경기 끝'): s.tour?esc(s.tour): `✅ 연결됨 · ${esc(s.name||CLI.name)} (${CH[s.ch||CLI.ch].name}) · 메인 화면에서 시작을 기다려요`;
  $('#cpad').classList.toggle('dim',!(s.scr==='fight'&&s.play)); }
function padUI(){ APP.scr='pad'; show(`<div class="cli"><div id="cst" class="cst">⏳ 연결 중…</div><div class="cbtns"><button class="ib" data-a="cml">📜 기술표</button><button class="ib" data-a="cchg">🔄 캐릭터</button><button class="ib" data-a="fs">⛶</button></div><div id="cpad" class="padbox"></div><div id="cml" class="cmlov" style="display:none">${moveListHTML()}<button class="mb b1 sm" data-a="cmlx">닫기</button></div></div>`);
  makePad($('#cpad'),b=>{ CLI.bits=b; if(NET.conn&&NET.conn.open) try{ NET.conn.send({k:'in',dev:NET.dev,b}); }catch(_){} }); clientUI(); }
// 버튼
ui.addEventListener('click',e=>{ const el=e.target.closest('[data-a]'); if(!el||el.disabled) return; ac(); snd('ui'); const a=el.dataset.a;
  if(a==='home'){ if(G) G.on=false; if(NET.role) hostStop(); APP.roster=[]; T=null; $('#padwrap').style.display='none'; titleUI(); }
  else if(a==='m1'){ APP.mode='solo'; selectUI(ch=>{ const cpu=Math.random()<0.5?'m':'f'; const go=()=>startFight([{name:'나',ch,ctl:isTouch?'pad':'kb'},{name:'컴퓨터',ch:cpu,ctl:'cpu'}],2,res=>resultUI(res,go)); go(); },'1인용 · 캐릭터 선택'); }
  else if(a==='pick'){ const cb=APP.onPick; cb&&cb(el.dataset.c); }
  else if(a==='m2'||a==='m3'){ APP.mode=a==='m2'?'duo':'tour'; APP.roster=[]; APP.best=a==='m2'?2:1; hostStart(()=>lobbyUI()); lobbyUI(); }
  else if(a==='m4') storyUI();
  else if(a==='join') joinUI();
  else if(a==='addkb'){ if(APP.roster.some(r=>r.ctl==='kb'||r.ctl==='pad')) return; APP.roster.unshift({id:'local',name:'메인',ch:'m',ctl:isTouch?'pad':'kb'}); lobbyUI(); }
  else if(a==='addcpu'){ const n=APP.roster.filter(r=>r.ctl==='cpu').length+1; APP.roster.push({id:'cpu'+n+Math.random().toString(36).slice(2,5),name:'컴퓨터'+n,ch:Math.random()<.5?'m':'f',ctl:'cpu'}); lobbyUI(); }
  else if(a==='kick'){ const r=APP.roster[+el.dataset.i]; if(r){ if(r.ctl.startsWith('net:')) NETP.delete(r.id); APP.roster.splice(+el.dataset.i,1); } lobbyUI(); }
  else if(a==='best'){ APP.best=+el.dataset.v; lobbyUI(); }
  else if(a==='lstart'){ if(APP.mode==='duo'){ const go=()=>startFight(APP.roster.slice(0,2),APP.best,res=>resultUI(res,go)); go(); } else tourStart(); }
  else if(a==='tnext') tourNext();
  else if(a==='tagain') tourStart();
  else if(a==='again'){ const g=APP.again; g&&g(); }
  else if(a==='cch'){ const nm=$('#jname'), cd=$('#jcode'); CLI.name=(nm&&nm.value||CLI.name).slice(0,8); const code=cd?cd.value:''; CLI.ch=el.dataset.c; localStorage.setItem('fg-ch',CLI.ch); joinUI(); if(code&&$('#jcode')) $('#jcode').value=code; }
  else if(a==='jgo'){ const code=($('#jcode').value||'').trim().toUpperCase(); CLI.name=($('#jname').value||'').trim().slice(0,8)||'플레이어'; localStorage.setItem('fg-name',CLI.name); if(!/^[A-Z0-9]{4}$/.test(code)) return alert('4자리 코드를 입력해 주세요'); padUI(); clientStart(code); goFull(); }
  else if(a==='cchg'){ CLI.ch=CLI.ch==='m'?'f':'m'; localStorage.setItem('fg-ch',CLI.ch); clSend({k:'ch',c:CLI.ch}); }
  else if(a==='fs') goFull();
  else if(a==='mlist') moveListUI(false);
  else if(a==='mclose'){ if(APP.mlBack==='pause'&&G){ G.pause=false; show(''); } else titleUI(); }
  else if(a==='cml'){ const o=$('#cml'); if(o) o.style.display='flex'; }
  else if(a==='cmlx'){ const o=$('#cml'); if(o) o.style.display='none'; }
});
// 호스트: 넷 플레이어 목록 동기화
setInterval(()=>{ if(NET.role==='host'&&APP.scr==='lobby'){ const before=JSON.stringify(APP.roster.map(r=>[r.id,r.name,r.ch,r.conn])); syncRoster(); if(JSON.stringify(APP.roster.map(r=>[r.id,r.name,r.ch,r.conn]))!==before) lobbyUI(); } },500);
function goFull(){ const d=document.documentElement; try{ (d.requestFullscreen||d.webkitRequestFullscreen).call(d).then(()=>{ try{ screen.orientation.lock('landscape').catch(()=>{}); }catch(_){} }).catch(()=>{}); }catch(_){} }
// 화면 비율 16:9 맞추기
function fit(){ const s=$('#stage'); const sw=innerWidth, sh=innerHeight; const k=Math.min(sw/W,sh/H); s.style.transform=`translate(-50%,-50%) scale(${k})`; $('#rot').style.display=(isTouch&&sh>sw)?'flex':'none'; }
addEventListener('resize',fit); addEventListener('orientationchange',()=>setTimeout(fit,200));
// 시작
loadImgs(()=>{ fit(); if(isTouch) makePad($('#padwrap'),b=>{ PADL.bits=b; PADL.latch|=b; }); const m=location.hash.match(/j=([A-Z0-9]{4})/i); if(m){ joinUI(); } else titleUI(); requestAnimationFrame(loop); });
window.__fg={get G(){ return G; },APP,NETP,KB,T:()=>T,startFight,tourStart};

</script>
</body></html>
